<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
        <title>Whack a mole</title>
        <link rel="stylesheet" href="style.css">
        <script src="diglett.js" defer></script>
</head>
<body>
    <h1>Whack a mole!</h1>
    <h2>Your Score:</h2>
    <h2 data-function="score" id="score">0</h2>
    <h2>Time Left:</h2>
    <h2 data-function="time-left" id="timeLeft">30</h2>
    <div class="b-grid">
        <div data-function="square" class="b-square"></div>
        <div data-function="square" class="b-square"></div>
        <div data-function="square" class="b-square"></div>
        <div data-function="square" class="b-square"></div>
        <div data-function="square" class="b-square"></div>
        <div data-function="square" class="b-square"></div>
        <div data-function="square" class="b-square"></div>
        <div data-function="square" class="b-square"></div>
        <div data-function="square" class="b-square"></div>
    </div>
</body>
</html>
